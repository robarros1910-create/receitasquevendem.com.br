    <!-- Safe JSON.stringify Patch to prevent circular reference crashes in tracking scripts or logs -->
    <script>
      (function() {
        const originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          try {
            return originalStringify(value, replacer, space);
          } catch (err) {
            try {
              const cache = new WeakSet();
              const result = originalStringify(value, function(key, val) {
                if (typeof key === 'string' && (key.startsWith('__react') || key.startsWith('__vd'))) {
                  return undefined;
                }
                if (val && (val instanceof HTMLElement || val instanceof Node || (val.constructor && (val.constructor.name === 'HTMLButtonElement' || val.constructor.name === 'FiberNode')))) {
                  return "[Element]";
                }
                if (typeof val === 'object' && val !== null) {
                  if (cache.has(val)) {
                    return "[Circular]";
                  }
                  cache.add(val);
                }
                if (typeof replacer === 'function') {
                  return replacer.call(this, key, val);
                }
                return val;
              }, space);
              if (result === undefined) {
                return "null";
              }
              return result;
            } catch (fallbackErr) {
              return "{}";
            }
          }
        };
      })();
    </script>
